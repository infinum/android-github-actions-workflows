name: Dismiss dev-only Dependabot alerts (reusable)

on:
  workflow_call:
    secrets:
      app-private-key:
        required: true
        description: |
          PEM private key of the `infinum-dependabot-dismisser` GitHub App.
          Used to mint an installation access token at runtime with
          `Dependabot alerts: read/write` on the caller repo. The default
          GITHUB_TOKEN cannot access the Dependabot Alerts REST API.
    inputs:
      client-id:
        type: string
        required: true
        description: |
          App ID (or Client ID) of the `infinum-dependabot-dismisser` GitHub
          App. Passed through to `actions/create-github-app-token@v3` via its
          `client-id` input, which accepts either form. Kept named `client-id`
          here for symmetry with the org-level variable
          `DEPENDABOT_DISMISSER_BOT_APP_ID`.
      dry-run:
        type: boolean
        default: true
        description: "When true, decisions are written to the job summary but no alerts are dismissed."
      java-version:
        type: string
        required: false
        default: "17"
        description: "JDK version for the Gradle run. Default 17; set to 11 for projects on AGP 7.x or older."
      trusted-sources:
        type: string
        required: false
        default: ""
        description: |
          Additional Maven-group glob patterns (one per line) to trust beyond the
          built-in defaults (com.android.*, androidx.*, org.jetbrains.kotlin.*,
          org.jetbrains.*, com.google.*). Caller lines append to the defaults.
          Patterns use `group.with.dots.*` or exact `group:artifact`.
      trusted-source-scopes:
        type: string
        required: false
        default: "buildscript"
        description: |
          Scopes (one per line) where the trusted-source rule applies. Allowed:
          buildscript, production, codegen-main. Default: buildscript only.
      production-build-types:
        type: string
        required: false
        default: "release"
        description: |
          Build type names (one per line, lowercase) considered production-shipping.
          Used to identify variant prefixes whose CompileClasspath/RuntimeClasspath
          configurations reach the published APK.
      production-variants:
        type: string
        required: false
        default: ""
        description: |
          Exact variant names (one per line) treated as production-shipping. When
          non-empty this overrides `production-build-types` — only these variant
          prefixes count as production.
      currency-threshold:
        type: string
        required: false
        default: "latest"
        description: |
          How close to the latest Maven release a trusted top-level must be.
          Allowed: `latest` (exact match) or `same-minor` (any patch within
          latest's major.minor).

jobs:
  list-alerts:
    name: List open Dependabot alerts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has-alerts: ${{ steps.fetch.outputs.has-alerts }}
      count: ${{ steps.fetch.outputs.count }}
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}

      - name: Fetch open Dependabot alerts
        id: fetch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          COUNT=$(gh api "repos/${REPO}/dependabot/alerts?state=open&per_page=100" --paginate | jq 'length')
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          if [ "${COUNT}" -gt 0 ]; then
            echo "has-alerts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-alerts=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "## Dismiss dev-only Dependabot alerts"
            echo ""
            echo "- Open alerts: \`${COUNT}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${COUNT}" -eq 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "_No open Dependabot alerts. Skipping Gradle analysis._" >> "$GITHUB_STEP_SUMMARY"
          fi

  dismiss:
    name: Categorize and dismiss
    needs: list-alerts
    if: needs.list-alerts.outputs.has-alerts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Mint a token for the checkout below. Submodules are other infinum
      # private repos, so the default GITHUB_TOKEN cannot fetch them; the app
      # token can. The composite action mints its own token for the Dependabot
      # Alerts API — this double-mint is cheap and keeps the action
      # self-contained for callers that invoke it directly.
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}

      - name: Checkout caller repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          submodules: recursive
          # lfs left at default (false): avoid bulk-downloading every LFS
          # object. The action materializes only the Gradle wrapper jar.

      # The composite action is the single source of truth for the analysis
      # pipeline. It assumes the caller repo is already checked out (above) and
      # runs entirely against this workspace.
      - name: Run dev-only Dependabot dismisser
        uses: infinum/android-github-actions-workflows/.github/actions/dismiss-dev-only-dependabot-alerts@main
        with:
          client-id: ${{ inputs.client-id }}
          app-private-key: ${{ secrets.app-private-key }}
          dry-run: ${{ inputs.dry-run }}
          java-version: ${{ inputs.java-version }}
          trusted-sources: ${{ inputs.trusted-sources }}
          trusted-source-scopes: ${{ inputs.trusted-source-scopes }}
          production-build-types: ${{ inputs.production-build-types }}
          production-variants: ${{ inputs.production-variants }}
          currency-threshold: ${{ inputs.currency-threshold }}
