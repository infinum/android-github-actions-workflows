name: 'Update version and generate changelog'
description: 'Updates the version and generates the changelog based on the pull request details'

inputs:
  github_token:
    description: 'The GitHub token'
    required: true
  filename:
    description: 'The name of the properties file to read and write version to'
    required: true
    default: 'version.properties'
  changelog_filename:
    description: 'The name of the file to write the changelog to'
    required: true
    default: 'CHANGELOG.md'
  

outputs:
  updated_version:
    description: 'The updated version'
    value: ${{ steps.predeploy_steps.outputs.updated_version }}
  current_tag:
    description: 'The current tag'
    value: ${{ steps.predeploy_steps.outputs.current_tag }}
  commits:
    description: 'The commits since the last tag'
    value: ${{ steps.predeploy_steps.outputs.commits }}
  pr_numbers:
    description: 'The pull request numbers'
    value: ${{ steps.predeploy_steps.outputs.pr_numbers }}
  pr_details:
    description: 'The pull request details'
    value: ${{ steps.predeploy_steps.outputs.pr_details }}
  is_breaking_change:
    description: 'Whether the pull request contains a breaking change'
    value: ${{ steps.predeploy_steps.outputs.is_breaking_change }}
  is_new_feature:
    description: 'Whether the pull request contains a new feature'
    value: ${{ steps.predeploy_steps.outputs.is_new_feature }}
  is_bugfix:
    description: 'Whether the pull request contains a bugfix'
    value: ${{ steps.predeploy_steps.outputs.is_bugfix }}
  changelog:
    description: 'The generated changelog'
    value: ${{ steps.predeploy_steps.outputs.changelog }}

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4
    - name: Read current version
      id: read_version
      uses: ./.github/actions/read_current_version
      with:
        filename: ${{ inputs.filename }}
    - name: Run predeploy steps
      id: predeploy_steps
      uses: ./.github/actions/common_modules_predeploy
      with:
        current_version: ${{ steps.read_version.outputs.current_version }}
        github_token: ${{ inputs.github_token }}
        changelog_filename: ${{ inputs.changelog_filename }}
    - name: Update version.properties
      if: steps.predeploy_steps.outputs.pr_numbers && steps.predeploy_steps.outputs.pr_details != '[]'
      uses: ./.github/actions/write_updated_version
      with:
        filename: ${{ inputs.filename }}
        updated_version: ${{ steps.update_version.outputs.updated_version }}
        current_version: ${{ steps.read_version.outputs.current_version }}
